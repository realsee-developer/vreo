name: Publish to NPM

on:
  push:
    branches:
      - 'codex/vreo-webgpu-release'
    tags:
      - 'v*.*.*'
      - 'v*.*.*-alpha.*'
      - 'v*.*.*-beta.*'
      - 'v*.*.*-rc.*'

jobs:
  publish-webgpu-candidate:
    name: Publish tested WebGPU candidate
    if: github.ref == 'refs/heads/codex/vreo-webgpu-release'
    runs-on: ubuntu-latest
    concurrency:
      group: vreo-webgpu-release
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          registry-url: 'https://registry.npmjs.org'
      - name: Verify release policy and tested candidate
        run: node --test ci/npm-release.test.mjs
      # Publish the exact tarball accepted by NextVR; do not rebuild different bytes.
      - name: Publish candidate and verify webgpu tag
        run: node ci/npm-release.mjs publish-candidate ci/release/webgpu.json
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}

  publish:
    name: Publish Package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 12.5.1
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build package
        run: pnpm build
      
      - name: Determine NPM tag
        id: npm-tag
        run: |
          node ci/npm-release.mjs tag "${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      
      - name: Publish to NPM
        run: |
          cd packages/vreo
          npm publish --tag ${{ steps.npm-tag.outputs.tag }} --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
      
      - name: Read CHANGELOG
        id: changelog
        run: |
          if [ -f packages/vreo/CHANGELOG.md ]; then
            # Extract the latest version's changelog
            CONTENT=$(sed -n '/^## /,/^## /p' packages/vreo/CHANGELOG.md | head -n -1)
            echo "content<<EOF" >> $GITHUB_OUTPUT
            echo "$CONTENT" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "content=Release ${{ steps.npm-tag.outputs.version }}" >> $GITHUB_OUTPUT
          fi
      
      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ steps.npm-tag.outputs.version }}
          body: ${{ steps.changelog.outputs.content }}
          draft: false
          prerelease: ${{ steps.npm-tag.outputs.tag != 'latest' }}
      
      - name: Sync to cnpm (if configured)
        if: steps.npm-tag.outputs.tag == 'latest'
        run: |
          cd packages/vreo
          pnpm postpublish || echo "cnpm sync not configured, skipping"
        continue-on-error: true
